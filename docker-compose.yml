services:
  troflow:
    build: .
    container_name: troflow
    restart: unless-stopped
    ports:
      - "${TROFLOW_PORT:-8080}:8000"
    environment:
      DATABASE_PATH: /app/data/troflow.db
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      TZ: ${TROFLOW_TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - troflow_data:/app/data
      - troflow_backups:/app/backups
      - troflow_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  troflow_data:
  troflow_backups:
  troflow_uploads:
