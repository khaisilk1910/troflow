name: TroFlow - Build, publish and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Avoid two pushes racing to deploy an older image after a newer one.
concurrency:
  group: troflow-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 'httpx>=0.27,<1'
      - name: Run business workflow tests
        run: python -m unittest discover -s tests -v

  publish:
    name: Build image and optionally trigger Portainer
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Compute lowercase GHCR image path
        id: vars
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.vars.outputs.image }}:latest
            ${{ steps.vars.outputs.image }}:sha-${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # If the secret is not set, publishing still succeeds; deploy manually in Portainer.
      - name: Trigger Portainer GitOps webhook
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -z "${PORTAINER_WEBHOOK_URL:-}" ]; then
            echo "Webhook not configured; image published but Portainer deployment is manual."
            exit 0
          fi
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 3 --max-time 30 \
            --request POST "$PORTAINER_WEBHOOK_URL"
