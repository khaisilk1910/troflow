name: TroFlow - Build Docker Image
run-name: TroFlow - Build & publish (${{ github.sha }})

# Only one workflow and one job on each push to main.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# A newer push supersedes any in-progress build from an older commit.
concurrency:
  group: troflow-main
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Test, audit, build and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 'httpx>=0.27,<1' 'pip-audit>=2.7,<3'
          python -m pip check

      - name: Audit Python dependencies (do not bypass vulnerabilities)
        run: python -m pip_audit --strict --requirement requirements.txt

      - name: Test Python application
        run: python -m unittest discover -s tests -v

      - name: Validate JavaScript syntax and UI tests
        run: |
          node --check app/static/app.js
          node --check app/static/tenant.js
          node --check app/static/advanced.js
          node --check app/static/integrations.js
          node tests/js_smoke.js
          node tests/test_tenant_ui.js
          node tests/test_repairs_ui.js
          node tests/test_invoice_print.js
          node tests/test_invoice_v54.js
          node tests/test_bank_catalog.js

      - name: Generate image tag
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ steps.image.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # This runs only AFTER image upload and only if the secret exists.
      - name: Update Portainer (optional)
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        shell: bash
        run: |
          if [ -z "${PORTAINER_WEBHOOK_URL:-}" ]; then
            echo "PORTAINER_WEBHOOK_URL not configured; image uploaded, redeploy manually."
            exit 0
          fi
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 3 --max-time 30 \
            --request POST "$PORTAINER_WEBHOOK_URL"
