# Portainer: Stacks -> Add stack -> Git repository -> compose path: deploy/portainer-stack.yml
# Docker standalone / Docker Compose (not Docker Swarm).
# Set TROFLOW_IMAGE in the Portainer stack environment to ghcr.io/<owner>/<repo>:latest.
services:
  troflow:
    image: ${TROFLOW_IMAGE:-ghcr.io/khaisilk1910/troflow:latest}
    container_name: troflow
    init: true
    restart: unless-stopped
    ports:
      # Docker bridge: the host PORT is configurable; container still listens on 8000.
      - "${TROFLOW_BIND_IP:-0.0.0.0}:${PORT:-8088}:8000"
    environment:
      DATABASE_PATH: /app/data/troflow.db
      COOKIE_SECURE: "${COOKIE_SECURE:-0}"
      TZ: "${TROFLOW_TZ:-Asia/Ho_Chi_Minh}"
      BACKUP_DIRECTORY: /app/backups
      UPLOAD_DIRECTORY: /app/uploads
      BACKUP_KEEP: "${BACKUP_KEEP:-14}"
      TROFLOW_SCHEDULER: "1"
      # Optional bot credentials may instead be saved in Admin UI (0600 file).
      # ZALO_BOT_USERNAME: "${ZALO_BOT_USERNAME:-}"
      # ZALO_BOT_PASSWORD: "${ZALO_BOT_PASSWORD:-}"
    volumes:
      - type: bind
        source: /opt/troflow/data
        target: /app/data
      - type: bind
        source: /opt/troflow/backups
        target: /app/backups
      - type: bind
        source: /opt/troflow/uploads
        target: /app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    stop_grace_period: 30s
